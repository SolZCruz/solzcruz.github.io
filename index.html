<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portafolio de ciencia de datos</title>
  <meta name="description" content="Portafolio de proyectos de ciencia de datos con SQL, Python y R.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="topbar">
    <p class="site-name">Portafolio de ciencia de datos</p>
    <div class="menu">
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menuPanel">Índice</button>
      <nav class="menu-panel" id="menuPanel" aria-label="Índice" hidden>
        <a href="#sobre-mi">Sobre mí</a>
        <a href="#habilidades">Habilidades y proyectos</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- PARTE 1: Inicio -->
  <section class="hero" id="inicio">
    <div class="field" aria-hidden="true">
      <span class="blob b1"></span>
      <span class="blob b2"></span>
      <span class="blob b3"></span>
      <span class="blob b4"></span>
    </div>
    <div class="grain" aria-hidden="true"></div>

    <div class="stage">
      <button class="orb" id="orb" aria-expanded="false" aria-controls="orbInfo" aria-label="Mostrar mi información">
        <span class="orb-ring" aria-hidden="true"></span>
        <span class="orb-core" aria-hidden="true"></span>
        <span class="orb-label" aria-hidden="true">Presiona</span>
      </button>
      <div class="orb-info" id="orbInfo">
        <h1>Tu Nombre</h1>
        <p class="role">Economista en formación</p>
        <p class="stack">Datos, econometría y análisis con SQL, Python y R.</p>
      </div>
    </div>

   
  </section>

  <!-- Las siguientes secciones se agregan aquí: #sobre-mi, #habilidades, #contacto -->

<script src="./script.js"></script>
</body>
</html>
